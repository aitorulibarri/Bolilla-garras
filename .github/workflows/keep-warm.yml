name: Keep warm

# Evita el cold start de Vercel + Neon (hiberna tras 5 min sin uso) llamando a /api/ping.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/ping
        run: curl -fsS --max-time 30 --retry 2 -o /dev/null -w "%{http_code} %{time_total}s\n" https://bolilla-garras-kwz7.vercel.app/api/ping
